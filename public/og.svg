    <rect x="368" y="405" width="176" height="46" rx="23" fill="#84cc16" />
    <text x="390" y="435" fill="#172304">Faltaría poco</text>

    <rect x="80" y="465" width="292" height="46" rx="23" fill="#f59e0b" />
