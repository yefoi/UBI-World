    <circle cx="1030" cy="205" r="13" fill="#84cc16" />
    <circle cx="1065" cy="330" r="13" fill="#f59e0b" />
    <circle cx="940" cy="370" r="13" fill="#ef4444" />
    <circle cx="1010" cy="420" r="13" fill="#9ca3af" />
    <circle cx="875" cy="340" r="13" fill="#84cc16" />
  </g>

  <rect x="80" y="88" width="76" height="8" rx="4" fill="#60a5fa" />
  <text x="80" y="205" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="92" font-weight="800" fill="#e8eef8">
    UBI World
  </text>
  <text x="80" y="280" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="36" fill="#93a4bd">
