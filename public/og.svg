<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220" />
      <stop offset="1" stop-color="#13233d" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2b3a57" />
    </pattern>
    <clipPath id="globe">
      <circle cx="990" cy="300" r="188" />
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#dots)" opacity="0.55" />
  <circle cx="990" cy="300" r="330" fill="url(#glow)" />

  <circle cx="990" cy="300" r="188" fill="#111a2b" stroke="#2b3a57" stroke-width="2" />
  <g clip-path="url(#globe)" stroke="#2b3a57" stroke-width="2" fill="none">
    <ellipse cx="990" cy="300" rx="70" ry="188" />
    <ellipse cx="990" cy="300" rx="135" ry="188" />
    <line x1="802" y1="300" x2="1178" y2="300" />
    <path d="M812 210 Q990 260 1168 210" />
    <path d="M802 300 Q990 340 1178 300" />
    <path d="M812 390 Q990 340 1168 390" />
  </g>
  <g>
